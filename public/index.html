<!DOCTYPE html>
<html lang="en">
<head>

    <title>My Own C++ Web Server</title>
    <link rel="stylesheet" href="/style.css">

</head>

<body>
    <h1>Welcome to the Home Page</h1>

    <p>This is a simple HTML page served by my C++ web server.</p>

    <a href="/about.html">About</a>

    <p id="status">Click the button below to see a message added by script.js:</p>

    <button id="testButton">Click Me</button>

    <p id="serverStatus">Checking server status...</p>

    <h2>Send a message</h2>

    <form action="/api/message" method="POST">
        <input type="text" name="message" placeholder="Enter a message">
        <button type="submit">Send</button>
    </form>


    <script src="/script.js"></script>
</body>

</html>
